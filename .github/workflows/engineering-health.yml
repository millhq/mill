# Weekly engineering-health report (goal 0413 S1) plus breach-becomes-work
# (goal 0413 S2): gathers PR/CI/test/lint/coverage/currency data via
# `gh api`, golangci-lint, eslint and the real toolchain registries,
# computes every metric in internal/tools/enghealth (Go, tested -- NOT a
# bash reimplementation of the math), and keeps ONE perpetually-updated
# "Engineering health" issue current. Reporting only: a budget breach
# marks status "warning" in the table, it never fails this job -- instead
# it opens or refreshes its own tracking issue (labelled platform-health
# plus the budget's own key), closed with a comment once the metric is
# back within budget, escalated on a second consecutive breach. No new
# GitHub Action for the breach loop: the same sha-pinned create-an-issue
# action runs once per breach file via a dynamic matrix job, everything
# else is `gh` CLI already used elsewhere in this file.
name: Engineering health

on:
  schedule:
    - cron: '0 7 * * 1' # Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      window_days:
        description: How many days of history to gather (the report itself always computes trailing 7d/28d columns from within this range)
        required: false
        default: '28'

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

concurrency:
  group: engineering-health
  cancel-in-progress: false

jobs:
  engineering-health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WINDOW_DAYS: ${{ github.event.inputs.window_days || '28' }}
    outputs:
      breach_files: ${{ steps.breaches.outputs.files }}
      breach_keys: ${{ steps.breaches.outputs.keys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the re-merge-round and QUARANTINE-28d-ago metrics read git history
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - name: Gather window bounds
        id: window
        run: |
          set -euo pipefail
          since_long=$(date -u -d "-${WINDOW_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          since_short=$(date -u -d "-7 days" +%Y-%m-%dT%H:%M:%SZ)
          echo "since_long=$since_long" >> "$GITHUB_OUTPUT"
          echo "since_short=$since_short" >> "$GITHUB_OUTPUT"
          mkdir -p enghealth-data

      # --- delivery: merged PRs against main -----------------------------
      - name: Gather merged PRs
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state merged --base main \
            --search "merged:>=${{ steps.window.outputs.since_long }}" \
            --json number,createdAt,mergedAt --limit 200 \
            > enghealth-data/prs.json

      # --- delivery + CI: workflow runs and their jobs -------------------
      - name: Gather workflow runs
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/$REPO/actions/runs?created=>=${{ steps.window.outputs.since_long }}&per_page=100" \
            --jq '.workflow_runs[]' \
          | jq -s '[.[] | {
              id, name, event,
              headBranch: .head_branch,
              conclusion,
              createdAt: .created_at,
              runStartedAt: .run_started_at,
              updatedAt: .updated_at
            }]' > enghealth-data/runs.json

      - name: Gather run jobs
        run: |
          set -euo pipefail
          : > /tmp/jobs.ndjson
          for id in $(jq -r '.[].id' enghealth-data/runs.json); do
            # $run_id below is a jq --arg substitution, not a shell one.
            # shellcheck disable=SC2016
            gh api "repos/$REPO/actions/runs/$id/jobs" --jq \
              --arg run_id "$id" \
              '.jobs[] | {runId: ($run_id | tonumber), name, createdAt: .created_at, startedAt: .started_at, completedAt: .completed_at, conclusion, labels}' \
              >> /tmp/jobs.ndjson || true
          done
          jq -s '.' /tmp/jobs.ndjson > enghealth-data/jobs.json

      # --- test: Playwright JSON reports off recent main runs ------------
      # ci.yml's e2e job uploads one JSON-reporter artifact PER SHARD
      # (`playwright-json-shard-<n>`, always, goal 0413 S1c) -- v4+
      # rejects re-uploading multiple jobs' artifacts under one shared
      # name in the same run, so there is no single fixed artifact name
      # to `-n` for. `-p` downloads every shard artifact matching the
      # glob, each into its own subdirectory under `-D`, which the
      # recursive `find` below already walks. A window with no matching
      # run/artifact still degrades to writing nothing, which is the
      # tool's own honest "no data" path, not a silent zero.
      - name: Gather Playwright JSON reports (7d)
        run: |
          set -euo pipefail
          run_ids=$(gh run list --repo "$REPO" --workflow CI --branch main --event push \
            --status success --created ">=${{ steps.window.outputs.since_short }}" \
            --json databaseId --limit 50 --jq '.[].databaseId')
          mkdir -p /tmp/pw-7
          for id in $run_ids; do
            gh run download "$id" --repo "$REPO" -p 'playwright-json-shard-*' -D "/tmp/pw-7/$id" 2>/dev/null || true
          done
          reports=$(find /tmp/pw-7 -name '*.json' 2>/dev/null || true)
          if [ -n "$reports" ]; then
            # shellcheck disable=SC2086
            jq -s '{suites: [.[] | .suites[]?]}' $reports > enghealth-data/playwright-7.json
          fi
      - name: Gather Playwright JSON reports (28d)
        run: |
          set -euo pipefail
          run_ids=$(gh run list --repo "$REPO" --workflow CI --branch main --event push \
            --status success --created ">=${{ steps.window.outputs.since_long }}" \
            --json databaseId --limit 50 --jq '.[].databaseId')
          mkdir -p /tmp/pw-28
          for id in $run_ids; do
            gh run download "$id" --repo "$REPO" -p 'playwright-json-shard-*' -D "/tmp/pw-28/$id" 2>/dev/null || true
          done
          reports=$(find /tmp/pw-28 -name '*.json' 2>/dev/null || true)
          if [ -n "$reports" ]; then
            # shellcheck disable=SC2086
            jq -s '{suites: [.[] | .suites[]?]}' $reports > enghealth-data/playwright-28.json
          fi

      # --- test: QUARANTINE.md 28 days ago --------------------------------
      - name: Gather QUARANTINE.md snapshot from 28 days ago
        run: |
          set -euo pipefail
          old_sha=$(git rev-list -1 --before="${{ steps.window.outputs.since_long }}" main || true)
          if [ -n "$old_sha" ] && git cat-file -e "$old_sha:frontend/e2e/QUARANTINE.md" 2>/dev/null; then
            git show "$old_sha:frontend/e2e/QUARANTINE.md" > enghealth-data/quarantine-28d-ago.md
          fi

      # --- code: lint offender counts -------------------------------------
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.13 (goal 0419 S2c): the first release built with go1.27,
          # matching go.mod's toolchain go1.27.1 bump.
          version: v2.13
          # Only the vote step below runs golangci-lint for real; this
          # action call installs the binary onto PATH without failing the
          # job on its own default full lint pass (reporting job, no gate).
          args: --build-tags=server ./internal/... --issues-exit-code=0
      - name: Golangci-lint JSON (issue counts only, not a gate)
        run: |
          set -euo pipefail
          golangci-lint run ./internal/... --build-tags=server --out-format json > enghealth-data/golangci.json || true
      - name: Eslint JSON (issue counts only, not a gate)
        working-directory: frontend
        run: |
          set -euo pipefail
          npx eslint . -f json > ../enghealth-data/eslint.json || true

      # --- code: coverage --------------------------------------------------
      - name: Go coverage profile
        run: go test ./internal/... -coverprofile=enghealth-data/cover.out || true
      - name: Vitest coverage summary
        working-directory: frontend
        run: npx vitest run --coverage --coverage.reporter=json-summary || true
      - run: cp frontend/coverage/coverage-summary.json enghealth-data/coverage-summary.json || true

      # --- dependencies + machinery: open PRs -----------------------------
      - name: Gather open Dependabot PRs
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state open --json number,createdAt,author --limit 100 \
            --jq '[.[] | select(.author.login == "app/dependabot" or .author.login == "dependabot") | {number, createdAt}]' \
            > enghealth-data/dependabot-prs.json
      - name: Gather open goal PRs
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state open --json number,createdAt,headRefName --limit 100 \
            --jq '[.[] | select(.headRefName | startswith("goal/")) | {number, createdAt}]' \
            > enghealth-data/goal-prs.json

      # --- machinery: shepherd re-merge rounds ----------------------------
      # A goal PR merges squashed (ADR-0034), so the "Merge remote-tracking
      # branch 'origin/main'" commits a re-armed pr-shepherd creates never
      # land on main's own history -- only GitHub's own retained per-PR
      # commit list still carries them, hence one API call per merged PR
      # rather than a single `git log` walk.
      - name: Count shepherd re-merge rounds
        run: |
          set -euo pipefail
          count_remerges() {
            local since="$1" total=0
            for n in $(gh pr list --repo "$REPO" --state merged --base main --search "merged:>=$since" --json number --jq '.[].number'); do
              # $needle below is a jq --arg substitution, not a shell one.
              # shellcheck disable=SC2016
              hits=$(gh api "repos/$REPO/pulls/$n/commits" --jq \
                --arg needle "Merge remote-tracking branch 'origin/main'" \
                '[.[] | select(.commit.message | contains($needle))] | length')
              total=$((total + hits))
            done
            echo "$total"
          }
          c7=$(count_remerges "${{ steps.window.outputs.since_short }}")
          c28=$(count_remerges "${{ steps.window.outputs.since_long }}")
          jq -n --argjson c7 "$c7" --argjson c28 "$c28" '{count7: $c7, count28: $c28}' \
            > enghealth-data/remerge-rounds.json

      # --- currency: toolchain pinned vs latest ---------------------------
      - name: Gather toolchain currency
        run: |
          set -euo pipefail
          pinned_go=$(awk '/^toolchain/ {print $2}' go.mod | sed 's/^go//')
          latest_go=$(curl -fsSL 'https://go.dev/dl/?mode=json' | jq -r '[.[] | select(.stable==true)][0].version' | sed 's/^go//')
          pinned_node=$(awk -F"'" '/node-version:/ {print $2; exit}' .github/workflows/ci.yml)
          latest_node=$(curl -fsSL 'https://nodejs.org/dist/index.json' | jq -r '[.[] | select(.lts != false)][0].version' | sed 's/^v//')
          pinned_wails=$(awk '/wailsapp\/wails\/v3 / {print $2}' go.mod)
          latest_wails=$(go list -m -versions github.com/wailsapp/wails/v3 | awk '{print $NF}')
          pinned_pw=$(node -p "require('./frontend/package.json').devDependencies['@playwright/test'] || require('./frontend/package.json').dependencies['@playwright/test']" | tr -d '^~')
          latest_pw=$(npm view @playwright/test version)
          jq -n \
            --arg gop "$pinned_go" --arg gol "$latest_go" \
            --arg nop "$pinned_node" --arg nol "$latest_node" \
            --arg wap "$pinned_wails" --arg wal "$latest_wails" \
            --arg pwp "$pinned_pw" --arg pwl "$latest_pw" \
            '{go: {pinned: $gop, latest: $gol}, node: {pinned: $nop, latest: $nol}, wails: {pinned: $wap, latest: $wal}, playwright: {pinned: $pwp, latest: $pwl}}' \
            > enghealth-data/currency.json

      # --- previous run's report, for Consecutive-breach tracking --------
      # Absent on a first run (no previous success yet) -- WriteBreaches'
      # own Consecutive math treats a missing/malformed --previous file
      # as "no data", starting at 1 (goal 0413 S2 contract item 1).
      - name: Gather the previous run's engineering-health.json
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous
          prev_id=$(gh run list --repo "$REPO" --workflow "Engineering health" \
            --status success --json databaseId --limit 1 --jq '.[0].databaseId // empty')
          if [ -n "$prev_id" ]; then
            gh run download "$prev_id" --repo "$REPO" -n engineering-health-report -D /tmp/previous 2>/dev/null || true
          fi

      - name: Ensure the platform-health/escalate labels exist
        run: |
          set -euo pipefail
          gh label create platform-health --repo "$REPO" --color B60205 \
            --description "A breached engineering budget, refreshed weekly" --force
          gh label create escalate --repo "$REPO" --color B60205 \
            --description "The same engineering budget breached two Mondays running" --force

      # --- compute + render -------------------------------------------------
      - name: Compute the report
        run: |
          set -euo pipefail
          previous_flag=""
          if [ -f /tmp/previous/engineering-health.json ]; then
            previous_flag="--previous /tmp/previous/engineering-health.json"
          fi
          # shellcheck disable=SC2086
          go run ./internal/tools/enghealth \
            --window 7,28 \
            --budgets .github/engineering-budgets.yml \
            --out engineering-health.json \
            --md engineering-health.md \
            --breaches breaches \
            $previous_flag

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engineering-health-report
          path: |
            engineering-health.json
            engineering-health.md
          retention-days: 90

      - name: List this run's breach files
        id: breaches
        run: |
          set -euo pipefail
          if [ -d breaches ] && [ -n "$(find breaches -maxdepth 1 -name '*.md' -print -quit)" ]; then
            files=$(find breaches -maxdepth 1 -name '*.md' -exec basename {} \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
            keys=$(find breaches -maxdepth 1 -name '*.md' -exec basename {} .md \; | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            files='[]'
            keys='[]'
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "keys=$keys" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.breaches.outputs.files != '[]'
        with:
          name: engineering-health-breaches
          path: breaches
          retention-days: 90

  # One create-an-issue call per breach file (contract item 2's "loop"):
  # a dynamic matrix is the only way to invoke a `uses:` step a variable
  # number of times, so this job exists purely to fan out that loop --
  # the breach markdown itself (title/labels/body, escalate label
  # included) is entirely Go's own output, nothing computed here.
  breach-issues:
    needs: engineering-health
    if: needs.engineering-health.outputs.breach_files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.engineering-health.outputs.breach_files) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engineering-health-breaches
          path: breaches

      # The pinned create-an-issue action creates the issue with whatever
      # label names it's given without first creating those labels --
      # GitHub 422s "Validation Failed" on a label that doesn't exist yet.
      # `labels:` is a YAML block list (goal 0413 S2b), so every entry is
      # its own `gh label create --force`, idempotent across concurrent
      # matrix jobs and safe to rerun for a label already created earlier
      # in this same workflow (platform-health, escalate).
      - name: Ensure this breach's labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MATRIX_FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          # `next` (not `sub()` followed by a separate exit pattern) --
          # sub() rewrites $0 in place, so a later pattern in the same
          # rule set would test the ALREADY-STRIPPED line, matching the
          # "not a list item" exit clause on every item and printing only
          # the first label (caught in review, goal 0413 S2b).
          awk '/^labels:/{f=1;next} f && /^  - /{print substr($0,5); next} f{exit}' \
            "breaches/${MATRIX_FILE}" \
          | while IFS= read -r label; do
              [ -z "$label" ] && continue
              gh label create "$label" --repo "$REPO" --color B60205 --force
            done

      - id: create_breach_issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: breaches/${{ matrix.file }}
          update_existing: true
          search_existing: all

      # create-an-issue's own update path only ever PATCHes body (its
      # own action.ts never sets labels or state on an existing issue),
      # so a label added after creation (escalate, once Consecutive
      # reaches 2) or a reopen after a prior recovery-close both need a
      # second, explicit call -- contract item 2's "Consecutive >= 2
      # adds the label escalate" and "opens or refreshes them" (staying
      # open, not silently going dark after one recovery cycle). The
      # action reports the issue it created or updated, so the immediate
      # mutation keeps that identity instead of waiting for label search
      # to discover the write.
      - name: Apply this breach's labels and reopen if recovery-closed it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MATRIX_FILE: ${{ matrix.file }}
          ISSUE_NUMBER: ${{ steps.create_breach_issue.outputs.number }}
        run: |
          set -euo pipefail
          number="$ISSUE_NUMBER"
          if ! [[ "$number" =~ ^[1-9][0-9]*$ ]]; then
            echo "engineering-health: create-an-issue returned invalid breach issue number: ${number:-<empty>}" >&2
            exit 1
          fi
          # Same `next`-terminated parse as the label-creation step above
          # -- see its comment for why sub()-then-test-$0 silently drops
          # every label after the first.
          labels=$(awk '/^labels:/{f=1;next} f && /^  - /{print substr($0,5); next} f{exit}' \
            "breaches/${MATRIX_FILE}" | paste -sd, -)
          gh issue edit "$number" --repo "$REPO" --add-label "$labels"
          state=$(gh issue view "$number" --repo "$REPO" --json state --jq .state)
          if [ "$state" = "CLOSED" ]; then
            gh issue reopen "$number" --repo "$REPO"
          fi

  # A budget back within budget: close its issue (contract item 2). Reads
  # the current readings straight out of this run's own JSON artifact
  # rather than re-computing anything.
  close-recovered:
    needs: engineering-health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BREACH_KEYS: ${{ needs.engineering-health.outputs.breach_keys }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engineering-health-report
          path: report
      - name: Close any platform-health issue outside this run's breach set
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          gh issue list --repo "$REPO" --label platform-health --state open --json number,labels \
            --jq '.[] | [.number, ([.labels[].name] | map(select(. != "platform-health" and . != "escalate")) | first // "")] | @tsv' \
          | while IFS=$'\t' read -r number key; do
              [ -z "$key" ] && continue
              if echo "$BREACH_KEYS" | jq -e --arg k "$key" 'index($k) != null' >/dev/null 2>&1; then
                continue
              fi
              reading=$(jq -r --arg k "$key" '.metrics[] | select(.budgetKey==$k) | .display7' report/engineering-health.json)
              budget=$(jq -r --arg k "$key" '.metrics[] | select(.budgetKey==$k) | .budgetDisplay' report/engineering-health.json)
              if [ -n "$reading" ] && [ "$reading" != "null" ]; then
                gh issue comment "$number" --repo "$REPO" --body "Back within budget on ${today}: ${reading} vs ${budget}."
              fi
              gh issue close "$number" --repo "$REPO"
            done

  # The one perpetually-updated "Engineering health" issue, last: its
  # Breaches section (contract item 2) names real issue numbers, so it
  # waits on breach-issues to have created/refreshed them first.
  health-issue:
    needs: [engineering-health, breach-issues]
    if: always() && needs.engineering-health.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engineering-health-report
          path: .

      - name: Fill in real issue numbers for the Breaches section
        run: |
          set -euo pipefail
          content=$(cat engineering-health.md)
          while IFS=$'\t' read -r number title; do
            content=${content//"- ${title}"/"- #${number} ${title}"}
          done < <(gh issue list --repo "$REPO" --label platform-health --state open --json number,title --jq '.[] | [.number, .title] | @tsv')
          printf '%s\n' "$content" > engineering-health.md

      - name: Build the issue body (front matter + the rendered table)
        run: |
          {
            echo "---"
            echo "title: Engineering health"
            echo "labels: engineering-health"
            echo "---"
            cat engineering-health.md
          } > issue-body.md

      - id: create_health_issue
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          filename: issue-body.md
          update_existing: true
          search_existing: all

      - name: Append the JSON as a collapsed comment
        env:
          ISSUE_NUMBER: ${{ steps.create_health_issue.outputs.number }}
        run: |
          set -euo pipefail
          number="$ISSUE_NUMBER"
          if ! [[ "$number" =~ ^[1-9][0-9]*$ ]]; then
            echo "engineering-health: create-an-issue returned invalid health issue number: ${number:-<empty>}" >&2
            exit 1
          fi
          {
            echo "<details><summary>engineering-health.json</summary>"
            echo
            echo '```json'
            cat engineering-health.json
            echo '```'
            echo "</details>"
          } > json-comment.md
          gh issue comment "$number" --repo "$REPO" --body-file json-comment.md
