# Enforces the repo-layout rule for the root directory: the root holds
# main.go (embeds + window/tray setup + service construction/wiring)
# plus its build-tag-split `package main` companions -- currently the
# singleinstance_{production,dev}.go pair, which MUST be `package main`
# (they're wired into main.go's application.New via a shared
# singleInstanceOptions func) and so cannot move under internal/; the
# production/!production split can't collapse into one file. Any OTHER
# root .go file is still flagged. Every Wails-bound service lives in its own
# bounded-context package under internal/services/<ctx>svc (the `svc`
# suffix prevents package-name collisions with internal/domain/* and
# internal/adapters/* -- never alias-import around a name), with shared
# cross-service helpers in internal/services/{seeding,servicetest}.
# This catches drift where a service, helper, or scratch .go file lands
# back at the repo root instead of in its package.
#
# ls-lint has no dedicated "allowlist" feature (checked directly against
# its own docs before adopting, not assumed) -- this uses its `regex:`
# rule (anchored ^{pattern}$ against the filename stem) to the same
# practical effect: any .go file ls-lint reaches whose stem isn't
# exactly `main` is flagged.
#
# Scoping note, confirmed empirically (not assumed from the docs, which
# don't show a "root only" example): ls-lint's top-level `ls:` keys are
# NOT implicitly root-scoped -- an extension rule with no directory-glob
# wrapper applies recursively to every matching file in the whole tree.
# There is no dedicated "root only, non-recursive" syntax either. The
# correct way to scope this rule to root is the inverse: `ignore:
# internal` below excludes the one other place .go files legitimately
# live (internal/domain/*, internal/adapters/*, internal/services/*,
# which follow ordinary Go package-naming convention, not this
# root-specific rule) -- proven by testing an intentionally-impossible
# regex both with and without this ignore entry before writing the real
# pattern.
# Second layer, same mechanism (added when a stray screenshot landed at
# root during a session): a `.*` catch-all so a random non-.go file
# (a .png, a .txt, a one-off .sh) can't silently join the root either.
# Probed empirically against ls-lint v2.3.1 before writing, same
# discipline as the scoping note above:
#   - `.*` matches every extension-bearing file the more specific `.go`
#     key doesn't claim first, including dotfiles (a dotfile's stem is
#     the part before its *last* dot -- `.golangci.yml` has stem
#     `.golangci`; single-segment dotfiles like `.gitignore` have an
#     empty stem, which no regex alternative should match, so they go
#     in `ignore:` -- confirmed `ignore:` accepts individual files, not
#     just directories).
#   - Extensionless files (LICENSE, a bare `ROGUEFILE`) are invisible
#     to ls-lint entirely -- a known, accepted limitation; nearly all
#     real root clutter carries an extension.
#   - Because top-level rules apply recursively (scoping note above),
#     every legitimate top-level directory must be in `ignore:`. A new
#     top-level directory therefore fails this check until deliberately
#     added here -- that's the point, not a bug: root additions are
#     layout decisions, never accidents.
ls:
  # auxwindows: the ADR-0033 second-window constructors (Quick Panel +
  # approval prompt), split from main.go along that family seam when it
  # crossed the 500-line convention -- `package main` (they wire into
  # main.go's app object) so they cannot move under internal/.
  # events: main.go's own application.RegisterEvent[T] calls (goal 0408
  # S1), split out the same way when adding one more call crossed the
  # 500-line convention -- `package main`, since RegisterEvent needs the
  # concrete Go type at the call site and every payload type already
  # belongs to a service package main.go itself imports.
  # traypaneldisplay (goal 0417): the tray panel's cursor-display
  # correction (trayPanelPosition + its wiring) -- `package main`
  # since it composes auxwindows.go's trayPanel/setupTray with
  # *application.App directly, and is its own file so the pure
  # translation function carries a dedicated, portable (non-darwin)
  # unit test file (traypaneldisplay_test.go).
  .go: regex:(main|auxwindows|events|singleinstance_(production|dev)|traypaneldisplay(_test)?)
  # SECURITY/CONTRIBUTING added goal 0028 (public-repo hygiene): both are
  # standard GitHub community-profile root files, same allowlist family as
  # README below (checked, not new -- CODE_OF_CONDUCT deliberately stays
  # OUT per goal 0028's skip list until a second contributor exists, so
  # it's not pre-added here).
  # AGENTS.md added goal 0049 (docs anti-rot, item 4): the cross-tool
  # agent-instructions convention at agents.md -- a one-line pointer
  # file to CLAUDE.md (not a symlink: Windows checkouts without
  # Developer Mode/admin can't create real symlinks, so a clone would
  # silently get a broken placeholder instead of Mill's actual context).
  # CHANGELOG: generated at the repo root by release-please on every
  # release PR, so without it here EVERY release PR fails this gate and
  # can never merge -- the release branch is the one branch that cannot
  # simply move the file elsewhere.
  # .gitguardian.yaml (goal 0358 S5): the secret scanner reads its
  # paths-ignore config only from the repo root -- it cannot be moved.
  .*: regex:(README|SECURITY|CONTRIBUTING|CLAUDE|AGENTS|RELEASING|CHANGELOG|Taskfile|lefthook|go|\.golangci|\.ls-lint|\.gitguardian)

ignore:
  # Public, inert code-recovery patches are kept outside the app and docs trees.
  - archive/retirement-2026-09-19
  # userdocs/ + skills/ (goal 0125, ADR-0001 extension): user-facing
  # docs and agent skills ship in the PUBLIC repo -- docs must embed
  # into the binary and stay licensable with the code; skills are the
  # packaged AI-surface (SKILL.md convention). Ordinary markdown
  # naming inside, not the root rule.
  - userdocs
  - skills
  # docs-drafts/ (goal 0237, ADR-0001 extension): ADR/goal-shaped
  # drafts a build agent writes in ITS OWN worktree when the real
  # docs/ repo is hard-blocked from that agent (CLAUDE.md's "In the
  # nested docs repo, stage only the files you changed" rule) --
  # content the orchestrator reviews and places into docs/adr/ or
  # docs/goals/ by hand, never committed to the public repo itself in
  # its own right (a stray leftover here is a review miss, not a
  # shipped state).
  - docs-drafts
  # examples/ (goal 0249, ADR-0001 extension): shippable example
  # content a user copies OUT of the repo -- the first resident is
  # examples/plugins/mill-bookmark, the runtime-plugin platform's own
  # reference plugin (copy the folder into the app's plugins directory
  # and reload). Plain web-file naming inside, not the root rule.
  - examples
  - build
  - frontend
  - bin
  - docs
  - .git
  - internal
  - scripts
  - .claude
  - .agents
  - .codex
  - .github
  - .task
  - .playwright-mcp
  - .gitignore
  - .DS_Store
  # semgrep/ (goal 0385, ADR-0001 extension): the Semgrep rule files
  # (vendor-names.yml today) a required CI job and lefthook both run
  # `semgrep --config semgrep/` against -- Semgrep's own convention puts
  # rule files in a directory named for the tool, not the root.
  - semgrep
  # docs/goals/BACKLOG.md Standing #11c: a stray root-level node_modules
  # (created by an npm/npx invocation run from the repo root instead of
  # frontend/) broke root-file-naming once, 2026-08-12 -- top-level
  # rules apply recursively (this file's own scoping note above), so an
  # accidental root node_modules would otherwise get every file inside
  # it flagged against the .go/.* patterns above. frontend/node_modules
  # is already covered by the `frontend` ignore entry; this is
  # specifically the root-level accident case.
  - node_modules
