# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Ali Al Dallal" # The name of the company
  productName: "Mill" # The name of the application
  productIdentifier: "com.alicoding.mill" # The unique product identifier
  description: "Guardrailed agentic-workflow automation" # The application description
  copyright: "© 2026 Ali Al Dallal" # Copyright text
  comments: "https://github.com/millhq/mill" # Comments
  version: "0.5.0" # The application version
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# iOS build configuration (uncomment to customise iOS project generation)
# Note: Keys under `ios` OVERRIDE values under `info` when set.
# ios:
#   # The iOS bundle identifier used in the generated Xcode project (CFBundleIdentifier)
#   bundleID: "com.mycompany.myproduct"
#   # The display name shown under the app icon (CFBundleDisplayName/CFBundleName)
#   displayName: "My Product"
#   # The app version to embed in Info.plist (CFBundleShortVersionString/CFBundleVersion)
#   version: "0.0.1"
#   # The company/organisation name for templates and project settings
#   company: "My Company"
#   # Additional comments to embed in Info.plist metadata
#   comments: "Some Product Comments"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    # Per-rebuild reap (docs/goals/BACKLOG.md Standing #8a, owner-hit
    # 2026-08-12 evening: THREE concurrent mill.dev.app instances,
    # traced live to this exact gap). `type: blocking` steps re-run on
    # EVERY reload cycle (refresh's own process.ProcessManager.Reload,
    # github.com/atterpac/refresh -- confirmed directly against the
    # vendored source, not assumed), unlike `background` above (first
    # run only). The `primary` step below (wails3 task run) is SUPPOSED
    # to have its own previous instance killed automatically by
    # refresh's ProcessManager before each restart (a process-group
    # SIGKILL) -- but a live-running dev session was directly observed
    # with two concurrent mill.dev.app processes from the SAME session,
    # one of them orphaned into a foreign process group refresh's own
    # tracking never reaped (root cause not fully pinned down: possibly
    # a globally-installed `wails3` CLI binary built against a
    # different `refresh` version than what this repo's own go.mod
    # pins for the app itself). Rather than patch a vendored third-party
    # dependency this repo doesn't own, this step is an independent,
    # pattern-based reap -- the same `pkill -f` shape Taskfile.yml's own
    # dev: task already uses for its start-of-session sweep -- that
    # runs regardless of whether refresh's own internal kill succeeds,
    # so an orphan can no longer survive past the NEXT rebuild cycle
    # even when refresh's own tracking misses it. Matches the exact
    # path Taskfile.yml's darwin:run task builds
    # (bin/mill.dev.app/Contents/MacOS/mill); `|| true` since the
    # common case (nothing stale yet) isn't an error.
    - cmd: pkill -f "bin/mill.dev.app/Contents/MacOS/mill" || true
      type: blocking
    - cmd: wails3 task run
      type: primary

